version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webpro_app
    restart: always
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    environment:
      - CI_ENVIRONMENT=development
      - IS_DOCKER=true
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: webpro_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: weblaboratorium
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: webpro_tunnel
    restart: always
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web

volumes:
  db_data:
